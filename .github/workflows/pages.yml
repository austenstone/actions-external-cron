name: Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Leaderboard
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7

      - uses: actions/configure-pages@v6

      - name: Collect run history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/workflows/scheduled-run.yml/runs?per_page=100" \
            --paginate \
            --jq '.workflow_runs[] | {name, event, created_at, run_started_at, conclusion}' \
            > runs.ndjson
          echo "Collected $(wc -l < runs.ndjson) runs."

      - name: Rebuild site data
        run: |
          mkdir -p site
          node scripts/leaderboard.mjs runs.ndjson --json site/data.json > /dev/null

      - name: Assemble Pages artifact
        run: |
          rm -rf publish
          mkdir -p publish/docs
          cp -R site/. publish/
          cp -R docs/. publish/docs/
          touch publish/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish

      - id: deployment
        uses: actions/deploy-pages@v5
